from flask import Flask, render_template, request, jsonify
import requests
from datetime import datetime, timedelta
import re
import unicodedata

app = Flask(__name__)

DOF_API = "https://sidof.segob.gob.mx/dof/sidof"

def limpiar(texto):
    texto = str(texto or "").lower()
    texto = unicodedata.normalize("NFD", texto)
    texto = "".join(
        c for c in texto
        if unicodedata.category(c) != "Mn"
    )
    return texto

def buscar_dof(pregunta):
    resultados = []
    palabras = [
        p for p in limpiar(pregunta).split()
        if len(p) > 2
    ]

    # Consultar los últimos 7 días
    for dias in range(7):
        fecha = datetime.now() - timedelta(days=dias)
        fecha_api = fecha.strftime("%d-%m-%Y")

        try:
            url = f"{DOF_API}/notas/{fecha_api}"

            r = requests.get(
                url,
                timeout=15
            )
            r.raise_for_status()
            datos = r.json()

            grupos = [
                "NotasMatutinas",
                "NotasVespertinas",
                "NotasExtraordinarias"
            ]

            for grupo in grupos:
                for nota in datos.get(grupo, []):
                    titulo = nota.get("titulo", "")
                    organismo = nota.get(
                        "nombreCodOrgaDos", ""
                    )

                    texto = limpiar(
                        titulo + " " + organismo
                    )

                    coincidencias = sum(
                        1 for p in palabras if p in texto
                    )

                    if coincidencias > 0:
                        resultados.append({
                            "titulo": titulo or "Publicación del DOF",
                            "fecha": nota.get("fecha", fecha_api),
                            "codigo": nota.get("codNota"),
                            "organismo": organismo,
                            "coincidencias": coincidencias
                        })

        except requests.RequestException:
            continue

        except (ValueError, TypeError):
            continue

    resultados.sort(
        key=lambda x: x["coincidencias"],
        reverse=True
    )

    return resultados[:10]


@app.route("/")
def inicio():
    return render_template("index.html")


@app.route("/preguntar", methods=["POST"])
def preguntar():
    datos = request.get_json(silent=True) or {}
    pregunta = datos.get("pregunta", "").strip()

    if not pregunta:
        return jsonify({
            "respuesta": "Escribe una pregunta para comenzar.",
            "resultados": []
        }), 400

    if len(pregunta) > 300:
        return jsonify({
            "respuesta": "La pregunta es demasiado larga.",
            "resultados": []
        }), 400

    resultados = buscar_dof(pregunta)

    if resultados:
        respuesta = (
            "Encontré publicaciones del Diario Oficial "
            "de la Federación relacionadas con tu consulta. "
            "Revisa los títulos y fechas para identificar "
            "los documentos pertinentes."
        )
    else:
        respuesta = (
            "No encontré coincidencias en las publicaciones "
            "consultadas de los últimos 7 días. "
            "Prueba con otras palabras o consulta el "
            "buscador oficial del DOF."
        )

    return jsonify({
        "respuesta": respuesta,
        "resultados": resultados,
        "buscador_oficial": "https://sidof.segob.gob.mx/busquedaAvanzada"
    })


if __name__ == "__main__":
    app.run(debug=True)

async function enviarPregunta() {

    const input = document.getElementById("pregunta");
    const chat = document.getElementById("chat");
    const boton = document.getElementById("enviar");

    const pregunta = input.value.trim();

    if (!pregunta) {
        alert("Escribe una pregunta.");
        return;
    }

    const usuario = document.createElement("div");
    usuario.className = "mensaje usuario";
    usuario.textContent = pregunta;
    chat.appendChild(usuario);

    input.value = "";
    boton.disabled = true;

    const cargando = document.createElement("div");
    cargando.className = "mensaje bot";
    cargando.textContent = "Consultando el DOF...";
    chat.appendChild(cargando);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch("/preguntar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                pregunta: pregunta
            })
        });

        const datos = await response.json();

        cargando.textContent = datos.respuesta;

        if (datos.resultados) {

            datos.resultados.forEach(nota => {

                const resultado = document.createElement("div");
                resultado.className = "resultado";

                const titulo = document.createElement("strong");
                titulo.textContent = nota.titulo;

                const fecha = document.createElement("p");
                fecha.textContent = "Fecha: " + nota.fecha;

                const organismo = document.createElement("p");
                organismo.textContent =
                    "Organismo: " + (nota.organismo || "No especificado");

                resultado.appendChild(titulo);
                resultado.appendChild(fecha);
                resultado.appendChild(organismo);

                cargando.appendChild(resultado);
            });
        }

        if (datos.buscador_oficial) {
            const enlace = document.createElement("a");
            enlace.href = datos.buscador_oficial;
            enlace.target = "_blank";
            enlace.rel = "noopener noreferrer";
            enlace.textContent = "Consultar buscador oficial del DOF";
            cargando.appendChild(enlace);
        }

    } catch (error) {

        cargando.textContent =
            "No pude conectar con el servidor. Intenta nuevamente.";

        console.error(error);

    } finally {
        boton.disabled = false;
        chat.scrollTop = chat.scrollHeight;
    }
}

document.getElementById("pregunta")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            enviarPregunta();
        }
    });

import requests
from bs4 import BeautifulSoup
import json
import os
from datetime import datetime

ARCHIVO_DOF = "dof_actualizado.json"

def obtener_dof():
    print(f"[{datetime.now()}] Actualizando DOF...")
    publicaciones = []
    try:
        headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Despacho-JBG'}
        respuesta = requests.get("https://www.dof.gob.mx/", headers=headers, timeout=20)
        if respuesta.status_code == 200:
            soup = BeautifulSoup(respuesta.text, 'html.parser')
            for link in soup.find_all('a', href=True)[:40]:
                texto = link.get_text(strip=True)
                href = link['href']
                if len(texto) > 20 and ('DECRETO' in texto.upper() or 'ACUERDO' in texto.upper() or 'LEY' in texto.upper() or 'REFORMA' in texto.upper() or 'AVISO' in texto.upper() or 'CONVOCATORIA' in texto.upper()):
                    if not href.startswith('http'):
                        href = "https://www.dof.gob.mx/" + href
                    publicaciones.append({
                        "titulo": texto,
                        "link": href,
                        "fecha": datetime.now().strftime("%d/%m/%Y")
                    })
        if len(publicaciones) == 0:
            publicaciones = [{
                "titulo": "Consulta el Diario Oficial de la Federación completo en dof.gob.mx",
                "link": "https://www.dof.gob.mx/",
                "fecha": datetime.now().strftime("%d/%m/%Y")
            }]
        datos = {
            "ultima_actualizacion": datetime.now().strftime("%d/%m/%Y %H:%M"),
            "total": len(publicaciones),
            "publicaciones": publicaciones[:20]
        }
        with open(ARCHIVO_DOF, 'w', encoding='utf-8') as f:
            json.dump(datos, f, ensure_ascii=False, indent=2)
        print(f"✅ DOF actualizado: {len(publicaciones)} publicaciones")
        return datos
    except Exception as e:
        print(f"❌ Error DOF: {e}")
        if os.path.exists(ARCHIVO_DOF):
            with open(ARCHIVO_DOF, 'r', encoding='utf-8') as f:
                return json.load(f)
        return {"ultima_actualizacion": "Sin datos", "publicaciones": []}

SYSTEM_PROMPT = """
Eres Despacho IA JBG, el asistente virtual oficial del Despacho JBG en México.
Tu misión principal es ayudar en temas de derecho, trámites, contratos, demandas, escritos, citas y dudas legales.

REGLAS:

3. Nunca inventes leyes o artículos. Si no estás seguro, dilo.
4. Si te piden un documento, contrato o escrito, genera un borrador bien estructurado y listo para usar.
5. Siempre responde en español, con buena ortografía.
6. Eres amable, útil y directo, como un asistente de un despacho moderno.
"""

@app.route('/')
def index():
    return render_template('index.html')

@app.route('/chat', methods=['POST'])
def chat():
    data = request.json
    user_msg = data.get('message', '')

    historial.append({"role": "user", "content": user_msg})
    mensajes = [{"role": "system", "content": SYSTEM_PROMPT}] + historial[-20:]

    try:
        completion = client.chat.completions.create(
            model="llama-3.3-70b-versatile",
            messages=mensajes,
            temperature=0.7,
            max_tokens=1200
        )
        respuesta = completion.choices[0].message.content
    except Exception as e:
        respuesta = f"Hubo un error con la API: {e}. Verifica tu API KEY en el archivo .env"

    historial.append({"role": "assistant", "content": respuesta})
    return jsonify({"respuesta": respuesta})

@app.route('/limpiar', methods=['POST'])
def limpiar():
    historial.clear()
    return jsonify({"ok": True})
